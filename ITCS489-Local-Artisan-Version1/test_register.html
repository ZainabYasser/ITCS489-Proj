<!DOCTYPE html>
<html>
<head>
    <title>Test Registration</title>
    <meta charset="UTF-8">
</head>
<body>
    <h1>Test Registration Form</h1>
    
    <form id="testForm">
        <input type="text" id="fullname" placeholder="Full Name" required><br><br>
        <input type="email" id="email" placeholder="Email" required><br><br>
        <input type="password" id="password" placeholder="Password" required><br><br>
        <button type="submit">Register</button>
    </form>
    
    <div id="result"></div>

    <script>
        const form = document.getElementById('testForm');
        const resultDiv = document.getElementById('result');
        
        form.addEventListener('submit', async function(e) {
            e.preventDefault();
            
            const fullname = document.getElementById('fullname').value;
            const email = document.getElementById('email').value;
            const password = document.getElementById('password').value;
            
            resultDiv.innerHTML = 'Sending request...';
            
            try {
                const response = await fetch('/ITCS489-Local-Artisan-/api.php?request=register', {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({ 
                        fullname: fullname, 
                        email: email, 
                        password: password, 
                        role: 'customer' 
                    })
                });
                
                const data = await response.json();
                
                if (data.success) {
                    resultDiv.innerHTML = '<h2 style="color:green">✅ Registration successful! User ID: ' + data.user_id + '</h2>';
                } else {
                    resultDiv.innerHTML = '<h2 style="color:red">❌ Registration failed: ' + data.message + '</h2>';
                }
            } catch (error) {
                resultDiv.innerHTML = '<h2 style="color:red">❌ Error: ' + error.message + '</h2>';
                console.error('Error:', error);
            }
        });
    </script>
</body>
</html>
