<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Forgot Password - ArtisanCo</title>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="../css/style.css">
</head>
<body class="auth-page">

<div class="auth-container">
    <div class="auth-card">
        <div class="auth-header">
            <i class="fas fa-key" style="font-size: 48px; color: #8B5E3C;"></i>
            <h3>Forgot Password?</h3>
            <p>Enter your email to reset your password</p>
        </div>
        <form id="forgot-form">
            <input type="email" id="email" placeholder="Email Address" required>
            <button type="submit" class="auth-btn">Send Reset Link</button>
        </form>
        <div class="auth-footer"><a href="login.html">Back to Login</a></div>
    </div>
</div>

<script>
    document.getElementById('forgot-form').addEventListener('submit', async (e) => {
        e.preventDefault();
        
        const email = document.getElementById('email').value;
        
        if (!email) {
            alert('Please enter your email address');
            return;
        }
        
        try {
            const response = await fetch('../api.php?request=forgot_password', {
                method: 'POST',
                headers: { 'Content-Type': 'application/json' },
                body: JSON.stringify({ email: email })
            });
            
            const data = await response.json();
            
            if (data.success) {
                alert('Password reset link sent to your email!');
                window.location.href = 'login.html';
            } else {
                alert(data.message || 'Email not found');
            }
        } catch (error) {
            console.error('Error:', error);
            alert('Network error. Please try again.');
        }
    });
</script>

<script src="../SHARED/utils.js"></script>
<script src="auth.js"></script>
<script src="../SHARED/main.js"></script>
</body>
</html>
