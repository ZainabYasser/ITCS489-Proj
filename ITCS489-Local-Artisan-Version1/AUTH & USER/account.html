<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>My Account - ArtisanCo</title>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="../css/style.css">
</head>
<body>

<header>
    <div class="container">
        <div class="navbar">
            <div class="logo">
                <a href="../index.html"><h2>Artisan<span>Co</span></h2></a>
            </div>
            <nav>
                <ul>
                    <li><a href="../index.html">Home</a></li>
                    <li><a href="../shop.html">Shop</a></li>
                    <li><a href="../auction.html">Auctions</a></li>
                </ul>
            </nav>
            <div class="nav-icons">
                <a href="../cart.html" class="cart-icon">
                    <i class="fas fa-shopping-cart"></i>
                    <span class="cart-count">0</span>
                </a>
                <button class="logout-btn" onclick="logout()">Logout</button>
            </div>
        </div>
    </div>
</header>

<section class="account-section">
    <div class="container">
        <h1 class="section-title">My Account</h1>
        
        <div class="account-tabs">
            <button class="tab-btn active" onclick="showTab('orders')">My Orders</button>
            <button class="tab-btn" onclick="showTab('wishlist')">Wishlist</button>
            <button class="tab-btn" onclick="showTab('profile')">Profile Settings</button>
            <button class="tab-btn" onclick="showTab('tracking')">Track Order</button>
        </div>
        
        <div id="orders-tab" class="tab-content active">
            <div class="dashboard-header">
                <h3>Order History</h3>
            </div>
            <div id="orders-container">
                <div class="loading"><div class="spinner"></div></div>
            </div>
        </div>
        
        <div id="wishlist-tab" class="tab-content">
            <div class="dashboard-header">
                <h3>My Wishlist</h3>
            </div>
            <div id="wishlist-container">
                <div class="loading"><div class="spinner"></div></div>
            </div>
        </div>
        
        <div id="profile-tab" class="tab-content">
            <div class="dashboard-header">
                <h3>Profile Information</h3>
            </div>
            <div class="form-container" style="max-width: 600px; margin: 0;">
                <form id="profile-form">
                    <div class="form-group">
                        <label>Full Name</label>
                        <input type="text" id="profile-name" required>
                    </div>
                    <div class="form-group">
                        <label>Email Address</label>
                        <input type="email" id="profile-email" required>
                    </div>
                    <div class="form-group">
                        <label>Phone Number</label>
                        <input type="text" id="profile-phone">
                    </div>
                    <button type="submit" class="auth-btn">Update Profile</button>
                </form>
            </div>
        </div>
        
        <div id="tracking-tab" class="tab-content">
            <div class="dashboard-header">
                <h3>Track Your Order</h3>
            </div>
            <div class="tracking-form">
                <input type="text" id="tracking-number" placeholder="Enter Order Number">
                <button class="btn-primary" onclick="trackOrder()">Track Order</button>
            </div>
            <div id="tracking-result"></div>
        </div>
    </div>
</section>

<footer>
    <div class="container">
        <div class="footer-content">
            <div class="footer-section">
                <h3>Artisan<span style="color: #8B5E3C;">Co</span></h3>
                <p>Connecting you with local artisans.</p>
            </div>
        </div>
        <div class="footer-bottom">
            <p>&copy; 2024 ArtisanCo. All rights reserved.</p>
        </div>
    </div>
</footer>

<script src="../SHARED/utils.js"></script>
<script src="auth.js"></script>
<script src="../SHARED/main.js"></script>
<script>
    function showTab(tabName) {
        document.querySelectorAll('.tab-content').forEach(tab => tab.classList.remove('active'));
        document.getElementById(`${tabName}-tab`).classList.add('active');
        
        document.querySelectorAll('.tab-btn').forEach(btn => btn.classList.remove('active'));
        if (event && event.target) event.target.classList.add('active');
    }

    async function loadOrders() {
        const container = document.getElementById('orders-container');
        const user = getCurrentUser();
        
        if (!user) {
            container.innerHTML = '<p>Please login to view orders</p>';
            return;
        }
        
        container.innerHTML = '<div class="loading"><div class="spinner"></div></div>';
        
        try {
            const response = await fetch('../api.php?request=get_orders');
            const data = await response.json();
            
            if (data.success && data.orders && data.orders.length > 0) {
                container.innerHTML = `
                    <div class="table-container">
                        <table class="data-table">
                            <thead>
                                <tr><th>Order #</th><th>Date</th><th>Total</th><th>Status</th><th>Action</th></tr>
                            </thead>
                            <tbody>
                                ${data.orders.map(order => `
                                    <tr>
                                        <td>${order.order_number}</td>
                                        <td>${new Date(order.created_at).toLocaleDateString()}</td>
                                        <td>BD ${parseFloat(order.total_amount).toFixed(2)}</td>
                                        <td><span class="status-badge status-${order.status}">${order.status}</span></td>
                                        <td><button onclick="viewOrder('${order.order_number}')">View</button></td>
                                    </tr>
                                `).join('')}
                            </tbody>
                        </table>
                    </div>
                `;
            } else {
                container.innerHTML = '<p>No orders yet. <a href="../shop.html">Start shopping</a></p>';
            }
        } catch (error) {
            console.error('Error loading orders:', error);
            container.innerHTML = '<p>Error loading orders</p>';
        }
    }

    async function loadWishlist() {
        const container = document.getElementById('wishlist-container');
        
        container.innerHTML = '<div class="loading"><div class="spinner"></div></div>';
        
        try {
            const response = await fetch('../api.php?request=get_wishlist');
            const data = await response.json();
            
            if (data.success && data.wishlist && data.wishlist.length > 0) {
                container.innerHTML = `
                    <div class="product-grid">
                        ${data.wishlist.map(item => `
                            <div class="product-card">
                                <div class="product-image">
                                    <img src="${item.image_url || 'https://placehold.co/300x250/8B5E3C/white?text=' + encodeURIComponent(item.name)}" alt="${item.name}">
                                </div>
                                <div class="product-info">
                                    <h3>${item.name}</h3>
                                    <p class="product-price">BD ${parseFloat(item.price).toFixed(2)}</p>
                                    <div class="product-actions">
                                        <button class="add-to-cart" onclick="addToCart(${item.product_id})">Add to Cart</button>
                                        <button class="wishlist-btn" onclick="removeFromWishlist(${item.product_id})"><i class="fas fa-heart"></i></button>
                                    </div>
                                </div>
                            </div>
                        `).join('')}
                    </div>
                `;
            } else {
                container.innerHTML = '<p>Your wishlist is empty. <a href="../shop.html">Browse products</a></p>';
            }
        } catch (error) {
            console.error('Error loading wishlist:', error);
            container.innerHTML = '<p>Error loading wishlist</p>';
        }
    }

    async function removeFromWishlist(productId) {
        try {
            const response = await fetch('../api.php?request=remove_from_wishlist', {
                method: 'DELETE',
                headers: { 'Content-Type': 'application/json' },
                body: JSON.stringify({ product_id: productId })
            });
            const data = await response.json();
            
            if (data.success) {
                showToast('Removed from wishlist', 'success');
                loadWishlist();
            } else {
                showToast(data.message || 'Error removing from wishlist', 'error');
            }
        } catch (error) {
            console.error('Remove from wishlist error:', error);
            showToast('Network error. Please try again.', 'error');
        }
    }

    function trackOrder() {
        const orderNumber = document.getElementById('tracking-number').value;
        if (!orderNumber) {
            showToast('Please enter an order number', 'error');
            return;
        }
        
        const resultDiv = document.getElementById('tracking-result');
        resultDiv.innerHTML = '<div class="loading"><div class="spinner"></div></div>';
        
        fetch(`../api.php?request=get_order&order_number=${orderNumber}`)
            .then(res => res.json())
            .then(data => {
                if (data.success && data.order) {
                    const order = data.order;
                    const statusOrder = ['pending', 'processing', 'shipped', 'delivered'];
                    const currentStep = statusOrder.indexOf(order.status) + 1;
                    const progressPercent = (currentStep / 4) * 100;
                    
                    resultDiv.innerHTML = `
                        <div class="tracking-info" style="background: #f9f6f3; padding: 20px; border-radius: 10px; margin-top: 20px;">
                            <h4>Order: ${order.order_number}</h4>
                            <div class="tracking-steps" style="margin-top: 20px;">
                                <div style="display: flex; justify-content: space-between; margin-bottom: 20px; flex-wrap: wrap;">
                                    <div style="${currentStep >= 1 ? 'color: #28a745;' : ''}"><i class="fas ${currentStep >= 1 ? 'fa-check-circle' : 'fa-circle'}"></i> Order Placed</div>
                                    <div style="${currentStep >= 2 ? 'color: #28a745;' : ''}"><i class="fas ${currentStep >= 2 ? 'fa-check-circle' : 'fa-circle'}"></i> Processing</div>
                                    <div style="${currentStep >= 3 ? 'color: #28a745;' : ''}"><i class="fas ${currentStep >= 3 ? 'fa-check-circle' : 'fa-circle'}"></i> Shipped</div>
                                    <div style="${currentStep >= 4 ? 'color: #28a745;' : ''}"><i class="fas ${currentStep >= 4 ? 'fa-check-circle' : 'fa-circle'}"></i> Delivered</div>
                                </div>
                                <div class="progress-bar" style="height: 4px; background: #ddd; border-radius: 2px;">
                                    <div style="width: ${progressPercent}%; height: 100%; background: #8B5E3C; border-radius: 2px;"></div>
                            </div>
                            <p style="margin-top: 20px;">
                                <strong>Status:</strong> ${order.status.charAt(0).toUpperCase() + order.status.slice(1)}<br>
                                <strong>Total Amount:</strong> BD ${parseFloat(order.total_amount).toFixed(2)}<br>
                                <strong>Order Date:</strong> ${new Date(order.created_at).toLocaleDateString()}
                            </p>
                        </div>
                    </div>`;
                } else {
                    resultDiv.innerHTML = `<p style="color: red;">Order #${orderNumber} not found.</p>`;
                }
            })
            .catch(error => {
                console.error('Track order error:', error);
                resultDiv.innerHTML = '<p style="color: red;">Error tracking order. Please try again.</p>';
            });
    }

    function viewOrder(orderNumber) {
        window.location.href = `../order_tracking.html?order=${orderNumber}`;
    }

    function showToast(message, type) {
        const toast = document.createElement('div');
        toast.className = `toast ${type}`;
        toast.textContent = message;
        document.body.appendChild(toast);
        setTimeout(() => toast.remove(), 3000);
    }

    document.addEventListener('DOMContentLoaded', () => {
        checkAuth();
        updateCartCount();
        loadOrders();
        loadWishlist();
        
        const profileForm = document.getElementById('profile-form');
        if (profileForm) {
            profileForm.addEventListener('submit', async (e) => {
                e.preventDefault();
                showToast('Profile updated!', 'success');
            });
        }
    });
</script>
</body>
</html>
