<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Track Order - ArtisanCo</title>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="css/style.css">
</head>
<body>

<header><div class="container"><div class="navbar"><div class="logo"><a href="index.html"><h2>Artisan<span>Co</span></h2></a></div></div></div></header>

<section style="padding: 60px 0;">
    <div class="container">
        <h1 class="section-title">Track Your Order</h1>
        <div class="tracking-form" style="max-width: 500px; margin: 0 auto;">
            <input type="text" id="order-number" placeholder="Enter Order Number">
            <button class="btn-primary" onclick="trackOrder()">Track</button>
        </div>
        <div id="tracking-result" style="margin-top: 40px;"></div>
    </div>
</section>

<script>
    function trackOrder() {
        const orderNumber = document.getElementById('order-number').value;
        if (!orderNumber) { alert('Please enter order number'); return; }
        document.getElementById('tracking-result').innerHTML = `
            <div style="background: #f9f6f3; padding: 30px; border-radius: 10px; max-width: 600px; margin: 0 auto;">
                <h3>Order: ${orderNumber}</h3>
                <div style="display: flex; justify-content: space-between; margin: 30px 0;">
                    <div>✓ Order Placed</div><div>● Processing</div><div>○ Shipped</div><div>○ Delivered</div>
                </div>
                <div style="height: 4px; background: #ddd;"><div style="width: 25%; height: 100%; background: #8B5E3C;"></div></div>
                <p style="margin-top: 20px;">Estimated delivery: 5-7 business days</p>
            </div>
        `;
    }
</script>
<script src="../shared/utils.js"></script>
<script src="auth.js"></script>
<script src="../shared/main.js"></script>
</body>
</html>
