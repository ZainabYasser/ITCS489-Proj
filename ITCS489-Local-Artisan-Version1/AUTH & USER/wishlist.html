<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>My Wishlist - ArtisanCo</title>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="css/style.css">
</head>
<body>

<header>
    <div class="container">
        <div class="navbar">
            <div class="logo"><a href="index.html"><h2>Artisan<span>Co</span></h2></a></div>
            <nav><ul><li><a href="index.html">Home</a></li><li><a href="shop.html">Shop</a></li></ul></nav>
            <div class="nav-icons"><a href="cart.html" class="cart-icon"><i class="fas fa-shopping-cart"></i><span class="cart-count">0</span></a><button class="logout-btn" onclick="logout()">Logout</button></div>
        </div>
    </div>
</header>

<section style="padding: 60px 0;">
    <div class="container">
        <h1 class="section-title">My Wishlist</h1>
        <div id="wishlist-container" class="product-grid"><div class="loading"><div class="spinner"></div></div></div>
    </div>
</section>

<script src="js/main.js"></script>
<script>
    async function loadWishlist() {
        const container = document.getElementById('wishlist-container');
        try {
            const response = await fetch('api.php?request=get_wishlist');
            const data = await response.json();
            if (data.success && data.wishlist && data.wishlist.length > 0) {
                container.innerHTML = data.wishlist.map(item => `
                    <div class="product-card">
                        <div class="product-info"><h3>${item.name}</h3><p class="product-price">$${item.price}</p>
                        <button class="add-to-cart" onclick="addToCart(${item.product_id})">Add to Cart</button>
                        <button onclick="removeFromWishlist(${item.product_id})">Remove</button></div>
                    </div>
                `).join('');
            } else { container.innerHTML = '<p>Your wishlist is empty.</p>'; }
        } catch (error) { container.innerHTML = '<p>Error loading wishlist</p>'; }
    }
    document.addEventListener('DOMContentLoaded', () => { checkAuth(); loadWishlist(); });
</script>
<script src="../shared/utils.js"></script>
<script src="auth.js"></script>
<script src="../shared/main.js"></script>
</body>
</html>
