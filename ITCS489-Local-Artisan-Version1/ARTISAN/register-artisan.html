<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Become an Artisan - ArtisanCo</title>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="../css/style.css">
</head>
<body class="auth-page">

<div class="auth-container">
    <div class="auth-card">
        <div class="auth-header">
            <i class="fas fa-hands-helping" style="font-size: 48px; color: #8B5E3C;"></i>
            <h3>Become an Artisan</h3>
            <p>Start selling your handmade creations</p>
        </div>
        
        <form id="register-artisan-form">
            <input type="hidden" name="role" value="artisan">
            <div class="form-group">
                <input type="text" id="fullname" placeholder="Full Name" required>
            </div>
            <div class="form-group">
                <input type="email" id="email" placeholder="Email Address" required>
            </div>
            <div class="form-group">
                <input type="text" id="shop_name" placeholder="Shop/Business Name" required>
            </div>
            <div class="form-group">
                <textarea id="bio" placeholder="Tell us about yourself and your craft..." rows="4" required></textarea>
            </div>
            <div class="form-group">
                <input type="text" id="location" placeholder="Location (City, Country)">
            </div>
            <div class="form-group">
                <input type="password" id="password" placeholder="Password" required>
            </div>
            <div class="form-group">
                <input type="password" id="confirm_password" placeholder="Confirm Password" required>
            </div>
            <button type="submit" class="auth-btn">Register as Artisan</button>
        </form>
        
        <div class="auth-footer">
            <p>Already have an account? <a href="../AUTH/login.html">Login here</a></p>
            <p style="margin-top: 10px;">Want to just shop? <a href="../AUTH/register.html">Register as Customer</a></p>
        </div>
    </div>
</div>

<script>
    function showToast(message, type) {
        const toast = document.createElement('div');
        toast.className = `toast ${type}`;
        toast.innerHTML = `<i class="fas ${type === 'success' ? 'fa-check-circle' : 'fa-exclamation-circle'}"></i> ${message}`;
        toast.style.cssText = `position: fixed; bottom: 20px; right: 20px; padding: 12px 20px; border-radius: 8px; color: white; z-index: 9999; background: ${type === 'success' ? '#28a745' : '#dc3545'};`;
        document.body.appendChild(toast);
        setTimeout(() => toast.remove(), 3000);
    }

    document.getElementById('register-artisan-form').addEventListener('submit', async function(e) {
        e.preventDefault();
        
        const fullname = document.getElementById('fullname').value;
        const email = document.getElementById('email').value;
        const shop_name = document.getElementById('shop_name').value;
        const bio = document.getElementById('bio').value;
        const location = document.getElementById('location').value;
        const password = document.getElementById('password').value;
        const confirm = document.getElementById('confirm_password').value;
        
        if (!fullname || !email || !shop_name || !bio || !password) {
            showToast('Please fill in all required fields', 'error');
            return;
        }
        
        if (password !== confirm) {
            showToast('Passwords do not match!', 'error');
            return;
        }
        
        if (password.length < 6) {
            showToast('Password must be at least 6 characters', 'error');
            return;
        }
        
        try {
            const response = await fetch('../api.php?request=register_artisan', {
                method: 'POST',
                headers: { 'Content-Type': 'application/json' },
                body: JSON.stringify({ 
                    fullname: fullname, 
                    email: email, 
                    password: password, 
                    shop_name: shop_name, 
                    bio: bio, 
                    location: location 
                })
            });
            
            const data = await response.json();
            
            if (data.success) {
                showToast('Registration successful! Please login.', 'success');
                setTimeout(() => {
                    window.location.href = '../AUTH/login.html';
                }, 1500);
            } else {
                showToast(data.message || 'Registration failed', 'error');
            }
        } catch (error) {
            console.error('Error:', error);
            showToast('Network error. Please try again.', 'error');
        }
    });
</script>

</body>
</html>
