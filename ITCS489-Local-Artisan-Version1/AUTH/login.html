<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Login - ArtisanCo</title>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="../css/style.css">
</head>
<body class="auth-page">

<div class="auth-container">
    <div class="auth-card">
        <div class="auth-header">
            <i class="fas fa-store" style="font-size: 48px; color: #8B5E3C;"></i>
            <h3>Welcome Back</h3>
            <p>Login to your ArtisanCo account</p>
        </div>
        
        <form id="login-form">
            <div class="form-group">
                <input type="email" id="email" placeholder="Email Address" required>
            </div>
            <div class="form-group">
                <input type="password" id="password" placeholder="Password" required>
            </div>
            <button type="submit" class="auth-btn">Login</button>
        </form>
        
        <div class="auth-footer">
            <p>Don't have an account? <a href="register.html">Register here</a></p>
            <p style="margin-top: 10px;">Want to sell your creations? <a href="../ARTISAN/register_artisan.html">Become an Artisan</a></p>
        </div>
    </div>
</div>

<script>
    document.getElementById('login-form').addEventListener('submit', async function(e) {
        e.preventDefault();
        
        const email = document.getElementById('email').value;
        const password = document.getElementById('password').value;
        
        if (!email || !password) {
            alert('Please enter email and password');
            return;
        }
        
        try {
            const response = await fetch('../api.php?request=login', {
                method: 'POST',
                headers: { 'Content-Type': 'application/json' },
                body: JSON.stringify({ email: email, password: password })
            });
            
            const data = await response.json();
            console.log('Login response:', data);
            
            if (data.success) {
                localStorage.setItem('user', JSON.stringify(data.user));
                alert('Login successful!');
                
                if (data.user.role === 'admin') {
                    window.location.href = '../ADMIN/admin-dashboard.html';
                } else if (data.user.role === 'artisan') {
                    window.location.href = '../ARTISAN/artisan-dashboard.html';
                } else {
                    window.location.href = '../index.html';
                }
            } else {
                alert(data.message || 'Login failed');
            }
        } catch (error) {
            console.error('Error:', error);
            alert('Network error. Please try again.');
        }
    });
</script>

<script src="../shared/utils.js"></script>
<script src="auth.js"></script>
<script src="../shared/main.js"></script>
</body>
</html>
